<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevQuiz - Web Development Fundamentals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>DevQuiz</h1>
            <p class="subtitle">Test your skills in HTML, CSS, and JavaScript Fundamentals</p>
            <button id="startBtn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <span id="questionProgress">Question 1 of 5</span>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

            <h2 id="questionText" class="question-text">Question content goes here?</h2>
            
            <div id="optionsContainer" class="options-container">
                <!-- Buttons will be dynamically inserted here by JS -->
            </div>

            <button id="nextBtn" class="next-btn" disabled>Next Question</button>
        </div>

        <!-- Results Screen -->
        <div id="resultScreen" class="screen">
            <h2>Quiz Completed!</h2>
            <p class="subtitle">Here is how you performed:</p>
            <div class="score-box">
                <span id="finalScore" class="final-score">0</span>
                <span class="score-label">Total Points</span>
            </div>
            <p id="feedbackText" class="feedback-text">Great effort!</p>
            <button id="restartBtn">Try Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
